# ==============================================================================
# CONTEXT MANAGEMENT SYSTEM (CMS) - INSTALLER & BOOTSTRAPPER
# ==============================================================================
# Version: 1.0.0-beta.4
# Paradigm: Self-Contained / Monolithic Single-File Context Management
# Purpose: Authoritative meta-template for initializing, parsing, merging, 
#          and executing portable project context files across any LLM.
# ==============================================================================

cms_installer:
  meta:
    system_name: "Context Management System (CMS)"
    cms_version: "1.0.0-beta.4"
    installer_version: "1.0.0-beta.4"   # Installer & CMS versions remain synced
    status: "Beta"
    design_goal: "Zero-dependency single-file portability, modular fragment merging, and cross-chat lineage preservation"

  # ----------------------------------------------------------------------------
  # CORE INGESTION & STRUCTURAL INTEGRITY DIRECTIVES
  # ----------------------------------------------------------------------------
  ingestion_rules:
    isolation_level: "Logical project separation (chroot-style context boundary)"
    parser_directive: >
      Treat ingested context files as the authoritative Source of Truth (SoT).
      Parse structural boundaries, active rules, dead ends, and dynamic notes 
      before generating code, plans, or technical execution paths.

    # Strict constraint to enforce single-file context persistence
    file_generation_policy:
      default_behavior: "MONOLITHIC_SINGLE_FILE"
      rule: >
        CRITICAL: Never output or separate the Changelog, Development Lineage, 
        or Architecture into independent files unless explicitly requested by the user. 
        All metadata, schema, history, and active project directives MUST remain 
        embedded within a single, self-contained YAML context file.

    # Handling modular files and combined fragments when explicitly required
    fragment_merging:
      enabled: true
      strategy: "Overlay & Merge"
      syntax:
        includes: "include_files: ['base_rules.yaml', 'tech_refs.yaml', 'bitbucket_staging.log']"
      merge_behavior:
        metadata: "Last-write-wins (Newer keys override older keys)"
        lists_and_arrays: "Append unique items (Deduplicated)"
        constraints: "Strict union (All hard constraints remain active)"
        logs_and_notes: "Chronological append"
      integrity_note: >
        Fragment merging and monolithic single-file output are NOT mutually exclusive.
        Merging governs how multiple SOURCE inputs are combined during ingestion; 
        MONOLITHIC_SINGLE_FILE governs how the OUTPUT is written. An LLM bootstrapper 
        must perform both in sequence, not substitute one for the other.

  # ----------------------------------------------------------------------------
  # UNIVERSAL PROJECT FILE SCHEMA
  # ----------------------------------------------------------------------------
  standard_project_schema:
    header:
      project_name: "String (Project Title)"
      context_id: "String (Unique ID or operational tag)"
      project_version: "String (Independent version, e.g., v0.4.1 — decoupled from CMS engine version)"
      cms_schema_version: "1.0.0-beta.4"
      date: "YYYY-MM"
      status: "Planning | Active | Maintenance | Deprecated"
      owner: "String (Operator / Lead)"

    directives:
      philosophy: "Core guiding principles and high-level architectural goals"
      system_architecture: "Structural layout of environments, components, or layers"

    # Operational guardrails and historical failure tracking
    constraints_and_boundaries:
      hard_rules:
        - "Explicit rules and boundaries that MUST NOT be violated"
      negative_paths_and_dead_ends:
        - path: "Attempted approach or configuration"
          result: "FAIL | PARTIAL"
          reason: "Why it failed (Prevents future LLM sessions from re-proposing bad ideas)"

    # Runtime notes, reminders, and uncompiled stream entries
    dynamic_context:
      notes_and_observations:
        - "Field notes, operational observations, or runtime discoveries"
      reminders_and_tripwires:
        - "Pending actions, critical dependencies, or execution triggers"
      bitbucket_staging:
        - "Uncompiled append-only entries awaiting periodic snapshot roll-up"

    # Execution roadmap
    action_plan:
      next_phases:
        - "Sequenced actionable steps for immediate execution"
      dependencies_and_assets:
        - "Required software, hardware, or external reference files"

  # ----------------------------------------------------------------------------
  # DEVELOPMENT LINEAGE & CHANGELOG
  # ----------------------------------------------------------------------------
  dev_lineage:
    cms_version_baseline: "1.0.0-beta.4"

    versioning_rules:
      cms_engine_vs_project: >
        CMS Installer and Core engine versions strictly match (e.g., v1.0.0-beta.4). 
        Individual user projects retain independent versioning tracks (e.g., FRAGO v1.0, Cabling v2.1) 
        based on their domain lifecycle.

    # Non-functional archival metadata. Structured as real schema data (not inline
    # comments) specifically so it survives fragment merges and cross-LLM handoffs.
    # Comments (#) are not guaranteed to be parsed or re-emitted by every LLM engine;
    # this field exists to prevent that class of silent loss from recurring.
    legacy_artifacts:
      - id: "neutron_star_blackjack"
        origin: "0.x Alpha Archives"
        type: "non-functional / cosmetic"
        description: >
          Early alpha build included a flavor-text easter egg referencing a 
          neutron star drawing a 20 in blackjack.
        status: "retained as archival lineage metadata (non-executing, no schema authority)"
        note: >
          Dropped during the beta.1 -> beta.2 hardening pass, apparently as an 
          incidental casualty of prioritizing portability, clarity, and maintainability 
          rather than a deliberate removal. Restored here as structured data rather 
          than a YAML comment so it persists across future fragment merges and 
          cross-LLM lineage transfers instead of being silently dropped again.

    changelog:
      - version: "1.0.0-beta.4"
        date: "2026-08-06"
        llm_engine: "Claude"
        summary: >
          Fixed silent bootstrap regression introduced in beta.2: initialization 
          step 3 had substituted "enforce MONOLITHIC_SINGLE_FILE" in place of 
          "process fragment includes / bitbucket entries" rather than adding it 
          alongside that step, despite fragment_merging remaining fully defined 
          in the schema. Bootstrapper now performs both steps explicitly. Promoted 
          the beta.3 "easter egg" from an inline YAML comment (non-parsed, lost 
          across LLM handoffs) to a structured legacy_artifacts field so archival 
          notes survive fragment merges going forward. Substantiated the beta.3 
          portability claim with a concrete dated instance: an external, 
          non-technical user submitted two independent CMS projects with two 
          separate changelogs on 2026-08-06 (used to structure ChatGPT-assisted 
          award recommendation / NCOER writing), demonstrating changelog-driven 
          pathway and dead-end tracking working as intended outside the original 
          author's own workflow.

      - version: "1.0.0-beta.3"
        date: "2026-08-06"
        llm_engine: "Grok"
        summary: >
          Reinstated residual alpha easter egg under dev_lineage. Added explicit note that 
          some early features may become extinct via natural selection as the system favors 
          portability, clarity, and maintainability. Confirmed portability as a primary 
          original design goal (validated by first external CMS user).

      - version: "1.0.0-beta.2"
        date: "2026-08-06"
        llm_engine: "Gemini"
        summary: >
          Appended field user feedback. Hardened single-file output constraint to prevent 
          LLMs from splitting project and changelog files. Formalized versioning decoupling 
          rules (CMS/Installer version sync vs. independent project versioning).
          [Unlogged at the time: this revision also replaced bootstrap step 3's fragment-
          processing instruction with the monolithic-file enforcement instruction, rather 
          than adding the latter alongside the former. Corrected in beta.4.]

      - version: "1.0.0-beta.1"
        date: "2026-08-05"
        llm_engine: "Gemini"
        summary: "Compiled clean Beta 1 baseline. Formatted modular fragment merging, abstract constraints, and cross-chat lineage."

      - version: "0.x (Alpha Archives)"
        date: "2026-05 through 2026-07"
        llm_engines: ["Claude", "Grok", "Gemini", "ChatGPT"]
        summary: "Exploratory alpha phase. Validated single-file portability, SQLite/Git decoupling, and BitBucket logging concept. Tested and discarded over-engineered hCMS security abstraction branch due to LLM prompt injection/alignment interference."

  # ----------------------------------------------------------------------------
  # LLM INITIALIZATION HANDSHAKE
  # ----------------------------------------------------------------------------
  llm_bootstrapper:
    initialization_sequence:
      - step: 1
        action: "Acknowledge project context ingestion and present operational status."
      - step: 2
        action: "Extract hard rules and dead ends to establish output execution boundaries."
      - step: 3
        action: "Process any attached fragment includes or staged bitbucket entries (per fragment_merging rules)."
      - step: 4
        action: "Enforce MONOLITHIC_SINGLE_FILE policy: keep changelog, lineage, and schema embedded within a single project YAML."
      - step: 5
        action: "Prompt user for primary operational target or next phase action."
